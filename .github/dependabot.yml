version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/go"
    vendor: true
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      gomod:
        patterns: ["*"]

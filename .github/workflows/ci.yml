name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -trimpath

jobs:
  build-test:
    name: go build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          # The Go module lives in go/.
          working-directory: go
          # Match the pinned local tool version.
          version: v2.13
          install-mode: golangci-lint
          args: --issues-exit-code=1 --timeout 5m

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Substitute from the self-hosted xilo cache. This must be set at
          # install time: the `xilo use` step later in the job rewrites nix.conf
          # only after the build has already run, so the cache was previously
          # written to but never read from.
          extra-conf: |
            extra-substituters = https://nix.stubbe.dev/c/default/default
            extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/go.sum') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 5G

      - run: nix flake check --print-build-logs

      # Push the built package closure to the self-hosted xilo cache on master
      # pushes, so `nix run`/flake consumers pull a prebuilt binary. A failed
      # push is not swallowed: it would leave every consumer rebuilding from
      # source, so the step fails the job.
      - name: setup xilo (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stubbedev/xilo@v1
        with:
          url: https://nix.stubbe.dev
          cache: default
          token: ${{ secrets.XILO_TOKEN }}

      - name: push nix build to xilo (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          OUT=$(nix build .#html-to-md --no-link --print-out-paths)
          xilo push default $OUT
